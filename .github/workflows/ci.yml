name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adonis_react_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # start/env.ts refuses to boot without these, and .env is not committed.
    # None is a secret: the key and the database exist only inside this job.
    env:
      TZ: UTC
      NODE_ENV: test
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: ci-only-key-not-a-secret-0123456789
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
      DB_CONNECTION: pg
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: adonis_react_test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate .adonisjs
        run: node ace codegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: node ace migration:run

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
